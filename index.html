<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gindo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="styles.css">
<title>Gindo</title>
</head>
<body>
<header class="app-head">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <h1>Gindo</h1>
    <span id="phase-badge" class="badge"></span>
    <button type="button" id="go-historial" class="icon-btn" aria-label="Historial" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" />
      </svg>
    </button>
    <button type="button" id="go-ajustes" class="icon-btn" aria-label="Ajustes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M4 8h10M18 8h2M4 16h4M12 16h8" /><circle cx="16" cy="8" r="2" /><circle cx="10" cy="16" r="2" />
      </svg>
    </button>
  </div>
</header>

<main>
  <section id="view-hoy">
    <div id="stage-idle">
      <p id="sync-status" class="hint" aria-live="polite"></p>
      <div id="day-switch" class="day-switch"></div>
      <div id="rest-day" class="callout hidden"></div>
      <div id="session-intro"></div>
      <button id="start-session" type="button" class="primary">Empezar entrenamiento</button>
    </div>

    <div id="stage-active" class="hidden">
      <div class="progress">
        <div class="progress-meta">
          <span id="progress-label"></span>
          <span id="session-clock" class="mono"></span>
        </div>
        <div class="progress-track"><div id="progress-fill"></div></div>
      </div>

      <div id="exercise-strip" class="strip"></div>

      <div id="rest-panel" class="rest-panel hidden" aria-live="polite">
        <div class="ring-wrap">
          <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
            <circle class="ring-bg" cx="60" cy="60" r="54" />
            <circle id="ring-fill" class="ring-fill" cx="60" cy="60" r="54" />
          </svg>
          <div class="ring-center">
            <span id="rest-time" class="mono">0:00</span>
          </div>
        </div>
        <div class="rest-next">
          <p class="kicker">Siguiente</p>
          <h3 id="rest-next-name"></h3>
          <p id="rest-next-meta" class="meta"></p>
        </div>
        <div class="rest-actions">
          <button type="button" id="rest-minus">−15s</button>
          <button type="button" id="rest-skip" class="primary">Listo, siguiente</button>
          <button type="button" id="rest-plus">+15s</button>
        </div>
      </div>

      <div id="current-card"></div>

      <button id="log-set" type="button" class="primary">Registrar serie</button>
      <button id="abort-session" type="button" class="ghost">Abandonar sesión</button>
    </div>

    <div id="stage-done" class="hidden">
      <div id="summary"></div>
      <button id="close-session" type="button" class="primary">Guardar sesión</button>
      <button id="resume-session" type="button" class="ghost">Volver al entrenamiento</button>
    </div>
  </section>

  <section id="view-historial" class="hidden">
    <div id="history"></div>
  </section>
</main>

<dialog id="sheet">
  <form method="dialog" class="sheet-inner">
    <div class="sheet-top">
      <div>
        <h2 id="sheet-title"></h2>
        <p id="sheet-sub" class="hint"></p>
      </div>
      <button type="button" id="sheet-cancel" class="icon-btn" aria-label="Cancelar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
    </div>

    <div class="sheet-body">
      <div class="sheet-group">
        <p id="reps-label" class="kicker">Repeticiones</p>
        <div class="stepper" role="group" aria-labelledby="reps-label">
          <button type="button" id="reps-minus" aria-label="Una repetición menos">−</button>
          <span id="reps-value" class="mono" aria-live="polite">0</span>
          <button type="button" id="reps-plus" aria-label="Una repetición más">+</button>
        </div>
      </div>

      <div class="sheet-group">
        <p id="rir-label" class="kicker">Te quedaban</p>
        <div id="rir-chips" class="chips" role="group" aria-labelledby="rir-label"></div>
      </div>
    </div>

    <div class="sheet-foot">
      <button type="button" id="pain-toggle" class="fold" aria-expanded="false" aria-controls="pain-chips">
        <span id="pain-state"></span>
        <span class="fold-cue">cambiar</span>
      </button>
      <div id="pain-chips" class="chips pain hidden" role="group" aria-label="Dolor de hombro, de 0 a 10"></div>
      <button type="button" id="sheet-save" class="primary">Guardar serie</button>
    </div>
  </form>
</dialog>

<dialog id="settings">
  <form method="dialog" class="sheet-inner">
    <div class="sheet-grab" aria-hidden="true"></div>
    <h2>Ajustes</h2>
    <p class="hint">La URL y el token se guardan solo en este teléfono. No viajan al repositorio.</p>

    <label class="field-label" for="hook-url">URL del Apps Script</label>
    <input id="hook-url" class="field" type="url" inputmode="url" placeholder="https://script.google.com/macros/s/.../exec"
           autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">

    <label class="field-label" for="hook-token">Token</label>
    <input id="hook-token" class="field" type="text" placeholder="una palabra larga que solo sepas tú"
           autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">

    <button id="hook-save" type="button" class="ghost">Guardar configuración</button>
    <button id="send-log" type="button" class="ghost">Enviar sesiones pendientes</button>
    <p id="send-hint" class="hint"></p>

    <button id="backup" type="button" class="ghost">Descargar copia del historial</button>
    <p id="backup-hint" class="hint"></p>

    <div class="sheet-actions">
      <button type="button" id="settings-close" class="primary">Cerrar</button>
    </div>
  </form>
</dialog>

<script type="module" src="app.js"></script>
</body>
</html>
