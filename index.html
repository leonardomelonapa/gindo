<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gindo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="styles.css">
<title>Gindo</title>
</head>
<body>
<header>
  <div class="head-row">
    <h1>Gindo</h1>
    <span id="phase-badge" class="badge"></span>
  </div>
  <p id="subtitle"></p>
  <nav class="tabs">
    <button data-view="hoy" class="active">Hoy</button>
    <button data-view="historial">Historial</button>
  </nav>
</header>

<main>
  <section id="view-hoy">
    <div id="day-switch" class="day-switch"></div>
    <div id="rest-day" class="card hidden"></div>
    <div id="exercises"></div>
    <button id="close-session" class="primary hidden">Cerrar sesión</button>
  </section>

  <section id="view-historial" class="hidden">
    <button id="copy-log" class="primary">Copiar log para el domingo</button>
    <p id="copy-hint" class="hint"></p>
    <div id="history"></div>
  </section>
</main>

<div id="sheet" class="sheet hidden">
  <div class="sheet-inner">
    <h2 id="sheet-title"></h2>
    <p id="sheet-sub" class="hint"></p>

    <label>Repeticiones</label>
    <div class="stepper">
      <button id="reps-minus">−</button>
      <span id="reps-value">0</span>
      <button id="reps-plus">+</button>
    </div>

    <label>RIR <span class="hint-inline">(repeticiones que te quedaban)</span></label>
    <div id="rir-chips" class="chips"></div>

    <label>Dolor de hombro <span class="hint-inline">(0-10)</span></label>
    <div id="pain-chips" class="chips pain"></div>

    <div class="sheet-actions">
      <button id="sheet-cancel">Cancelar</button>
      <button id="sheet-save" class="primary">Guardar serie</button>
    </div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
